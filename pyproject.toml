[project]
name = "dotfig"
version = "0.1.0"
description = "Manage dot files"
readme = "README.md"
authors = [
    { name = "Sheldon McGrandle", email = "developer@8cylinder.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[project.scripts]
dotfig = "dotfig:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"


# [tool.ty.rules]
# dynamic-function-decorator-return = "error"
# missing-type-argument = "error"
# possibly-unresolved-reference = "warn"
# unsound-return-statement = "error"

[tool.ruff.lint]
#extend-select = ["ANN", "PYI"]
select = ["ANN"]
#preview = true

#[tool.ruff.lint]
# Enable all available rules, including preview rules
#select = ["ALL"]

#[tool.ruff.lint]
#select = ["ANN"] # Enforces missing type annotations
